name: Release

# Publicação de uma versão. Só manual e só da `main`.
#
# Antes de rodar pela primeira vez:
# - proteções já configuradas no GitHub: `main` só por PR com o CI verde, environment
#   `release` só da `main` e com aprovador obrigatório, tags imutáveis;
# - conta no repositório central de pacotes, com segundo fator, e o namespace verificado;
# - segredos do environment `release`: SIGNING_KEY (chave privada em ASCII), SIGNING_PASSWORD,
#   REPOSITORY_USERNAME e REPOSITORY_PASSWORD. Nenhum segredo fica no repositório.
#
# A etapa de envio ao repositório central é ligada quando a conta existir.

on:
  workflow_dispatch:

permissions: {}

jobs:
  # Testes e build sem nenhum segredo nem permissão de escrita.
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - run: ./gradlew :consent:testDebugUnitTest :consent:assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consent-unsigned
          path: consent/build/outputs/aar/consent-release.aar
          if-no-files-found: error

  # Assina e atesta o AAR que o job anterior construiu. Nada do código do repositório roda
  # aqui: o checkout não é feito, e a chave só existe neste job.
  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: consent-unsigned
          path: out
      - name: Assinar o AAR
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY ausente"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          # Senha pela entrada padrão: nunca na linha de comando, visível na lista de processos.
          printf '%s' "$SIGNING_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign out/consent-release.aar
          rm -rf "$GNUPGHOME"
      # Proveniência verificável do artefato, ligada a este commit e a este workflow.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: out/consent-release.aar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consent-release
          path: |
            out/consent-release.aar
            out/consent-release.aar.asc
